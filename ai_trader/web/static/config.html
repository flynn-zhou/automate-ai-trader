<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>仓位配置 · 本金 / 风险 / 杠杆</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#2a2f3d; --txt:#d8dee9;
          --dim:#8b95a7; --ok:#3aa675; --warn:#e8b44a; --err:#e05c6a;
          --accent:#6ba3f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:13px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .nav a { color:var(--dim); text-decoration:none; margin-right:12px; }
  .nav a:hover { color:var(--accent); }
  main { max-width:880px; margin:0 auto; padding:22px 16px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
          gap:14px; margin-bottom:20px; }
  .field { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:14px; }
  .field label { display:block; color:var(--dim); font-size:12px;
                 margin-bottom:6px; }
  .field input { width:100%; background:#0f1117; color:var(--txt);
      border:1px solid var(--line); border-radius:6px; padding:9px 11px;
      font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  .field input:focus { outline:none; border-color:var(--accent); }
  .field .hint { color:var(--dim); font-size:11px; margin-top:6px; }
  table { width:100%; border-collapse:collapse; margin-top:6px; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  td.num { font-variant-numeric:tabular-nums; font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:14px 16px; margin-bottom:18px; }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { background:var(--accent); color:#0b0d12; border:none;
           border-radius:6px; padding:9px 18px; font:inherit;
           font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button.ghost { background:transparent; color:var(--dim);
                 border:1px solid var(--line); font-weight:400; }
  #msg { font-size:12px; }
  .ok { color:var(--ok); } .bad { color:var(--err); } .warn { color:var(--warn); }
  .live { font-size:12px; color:var(--dim); }
  .live b { color:var(--txt); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>仓位配置</h1>
  <nav class="nav">
    <a href="/">实时看板</a><a href="/range">区间演化</a><a href="/config">仓位配置</a>
  </nav>
</header>
<main>
  <div class="card">
    <div class="grid">
      <div class="field">
        <label>本金（USDT）</label>
        <input id="capital" type="number" step="1" min="1" value="100">
        <div class="hint">单笔风险按这个数算，与交易所余额无关</div>
      </div>
      <div class="field">
        <label>每笔风险（%）</label>
        <input id="risk_pct" type="number" step="0.5" min="0.1" max="100" value="5">
        <div class="hint">5% ⇒ 亏 20 次才归零</div>
      </div>
      <div class="field">
        <label>杠杆（倍）</label>
        <input id="leverage" type="number" step="1" min="1" max="125" value="22">
        <div class="hint">爆仓距离 = 1/杠杆 − 0.5%</div>
      </div>
    </div>
    <div class="actions">
      <button id="save">保存并立即生效</button>
      <button id="reset" class="ghost">重新读取</button>
      <span id="msg"></span>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:4px;"><strong>四行派生</strong>
      <span class="live" style="margin-left:10px;">随输入实时计算（由服务端算，前端不重算）</span></div>
    <table>
      <thead><tr><th style="width:44%;">项目</th><th>数值</th><th>含义</th></tr></thead>
      <tbody id="rows">
        <tr><td colspan="3" style="color:var(--dim);">读取中…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card live" id="liveBox">当前生效：读取中…</div>
</main>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = (p) => p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);

const $ = (id) => document.getElementById(id);
const val = () => ({
  capital: parseFloat($('capital').value),
  risk_pct: parseFloat($('risk_pct').value),
  leverage: parseFloat($('leverage').value),
});

function setMsg(txt, cls) {
  const m = $('msg'); m.textContent = txt || '';
  m.className = cls || '';
}

function renderRows(derived) {
  const tb = $('rows');
  if (!derived || !derived.ok) {
    tb.innerHTML = '<tr><td colspan="3" class="bad">' +
      ((derived && derived.error) || '无法计算') + '</td></tr>';
    return;
  }
  // 注意：as_rows() 返回的是 {label, value} 字典，不是 [name, value] 数组。
  // 曾按数组下标去取，页面上四行全变成 undefined（后端测试全绿，只有人眼能发现）。
  const notes = {
    '每笔风险 R': '单笔最大亏损（向下取整）',
    '爆仓距离': '价格反向走多远会被强平',
    '止损距离上限': '止损必须窄于此值，保证止损先于爆仓',
    '单笔保证金上限': '单笔最多占用的保证金',
  };
  tb.innerHTML = (derived.rows || []).map(r => {
    const name = r.label, value = r.value;
    const note = notes[name] || '';
    return '<tr><td>' + name + '</td><td class="num">' + value +
           '</td><td style="color:var(--dim);font-size:12px;">' + note + '</td></tr>';
  }).join('') +
  '<tr><td>可连亏次数</td><td class="num">' + derived.lives + ' 次</td>' +
  '<td style="color:var(--dim);font-size:12px;">本金 / 单笔风险</td></tr>';
}

function renderLive(live) {
  if (!live) return;
  $('liveBox').innerHTML = '当前生效：本金 <b>' + live.paper_balance +
    '</b> U · 每笔风险 <b>' + live.risk_pct + '</b> % · 杠杆 <b>' +
    live.max_leverage + '</b> x';
}

// 试算：防抖，避免每敲一个字符就打一次接口
let timer = null;
function preview() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const v = val();
    if (![v.capital, v.risk_pct, v.leverage].every(Number.isFinite)) {
      renderRows({ok:false, error:'三个参数都要填数字'});
      return;
    }
    try {
      const r = await fetch(q('/api/config/sizing?capital=' + v.capital +
        '&risk_pct=' + v.risk_pct + '&leverage=' + v.leverage));
      const d = await r.json();
      renderRows(d.derived);
    } catch (e) {
      renderRows({ok:false, error:'试算请求失败：' + e});
    }
  }, 220);
}

async function loadAll() {
  try {
    const r = await fetch(q('/api/config/sizing'));
    const d = await r.json();
    if (!d.ok) { setMsg(d.error || '读取失败', 'bad'); return; }
    $('capital').value = d.sizing['sizing.capital'];
    $('risk_pct').value = d.sizing['sizing.risk_pct'];
    $('leverage').value = d.sizing['sizing.leverage'];
    renderRows(d.derived);
    renderLive(d.live);
    setMsg('');
  } catch (e) {
    setMsg('读取失败：' + e, 'bad');
  }
}

async function save() {
  const v = val();
  if (![v.capital, v.risk_pct, v.leverage].every(Number.isFinite)) {
    setMsg('三个参数都要填数字', 'bad'); return;
  }
  setMsg('保存中…', '');
  try {
    const r = await fetch(q('/api/config/sizing'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(v),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) { setMsg(d.error || ('保存失败 ' + r.status), 'bad'); return; }
    renderRows(d.derived);
    renderLive(d.live);
    setMsg('已保存并生效（引擎下一次决策即用新参数）', 'ok');
  } catch (e) {
    setMsg('保存失败：' + e, 'bad');
  }
}

['capital','risk_pct','leverage'].forEach(id => $(id).addEventListener('input', preview));
$('save').onclick = save;
$('reset').onclick = loadAll;
loadAll();
</script>
</body>
</html>
