<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Trader · 3s 行情 + 交易因果大屏</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111821; --panel2:#0d131b; --line:#1d2735;
    --txt:#d7e0ea; --dim:#768494; --up:#26a69a; --down:#ef5350;
    --accent:#4aa3ff; --warn:#e2b93b; --err:#ef5350; --ok:#26a69a; --vio:#a970ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"JetBrains Mono","Cascadia Mono",Consolas,Menlo,monospace;font-size:13px}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:7px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:1px;color:var(--accent)}
  .price{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12px}
  .chip b{color:var(--txt);font-variant-numeric:tabular-nums}
.chip.warn{border-color:#5c4a20;background:#1e1a10}
.chip.warn b{color:var(--warn)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.WS{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.REST{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.DOWN{background:var(--err);box-shadow:0 0 8px var(--err)}
  .sep{width:1px;height:22px;background:var(--line)}
  main{flex:1 1 auto;display:grid;grid-template-columns:1fr 430px;min-height:0}
  #chartWrap{position:relative;min-width:0;min-height:0;background:var(--panel2)}
  canvas#cv{display:block;width:100%;height:100%}
  #toolbar{position:absolute;left:10px;top:8px;display:flex;gap:6px;z-index:2}
  #toolbar button{background:#182334;border:1px solid var(--line);color:var(--dim);
    padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
  #toolbar button.on{background:#1d3450;border-color:var(--accent);color:#fff}
  #legend{position:absolute;left:10px;top:38px;color:var(--dim);font-size:11.5px;z-index:2;line-height:1.6}
  aside{border-left:1px solid var(--line);background:var(--panel);display:flex;
    flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
  .tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--dim);padding:8px 4px;font-family:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:#fff;border-bottom-color:var(--accent);background:#131c27}
  .pane{flex:1 1 auto;overflow:auto;min-height:0;display:none}
  .pane.on{display:block}
  .dec{padding:6px 10px;border-bottom:1px solid #151d27;font-size:11.5px;line-height:1.5}
  .dec .t{color:#5d6c7e;font-size:10.5px}
  .dec .act{font-weight:700;margin-right:6px}
  .dec.open_long .act,.dec.open_short .act{color:var(--up)}
  .dec.close .act{color:var(--warn)}
  .dec.watch .act{color:var(--accent)}
  .dec.skip .act{color:#6b7784}
  .dec.hold .act{color:var(--dim)}
  .dec .rs{color:#93a2b3;word-break:break-all}
  .dec .sig{color:var(--vio);font-size:10.5px}
  .gates{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
  .g{font-size:10px;padding:1px 6px;border-radius:3px;background:#16202b;color:#7d8b9b}
  .g.ok{color:var(--ok)} .g.no{color:var(--err);background:#2a1719}
  .card{margin:10px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
  .card h4{margin:0 0 6px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.5px}
  .kv{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
  .kv span:first-child{color:var(--dim)}
  .kv b{font-variant-numeric:tabular-nums}
  .pos-long{border-color:#1d4a45;box-shadow:inset 0 0 0 1px #142f2c}
  .pos-short{border-color:#4a1d1d;box-shadow:inset 0 0 0 1px #2f1414}
  .jr{padding:8px 10px;border-bottom:1px solid #151d27;font-size:11.5px;line-height:1.55}
  .jr .k{font-size:9.5px;padding:1px 5px;border-radius:3px;margin-right:5px;
    background:#1b2a3a;color:var(--accent);text-transform:uppercase}
  .jr .k.pivot{background:#3a2a1b;color:var(--warn)}
  .jr .k.result{background:#1b3a2a;color:var(--ok)}
  .jr .k.alert{background:#3a1b1b;color:var(--err)}
  .jr .ti{color:#cfd9e4;font-weight:600}
  .jr .bd{color:#8b98a7;margin-top:2px;white-space:pre-wrap}
  #tape table{width:100%;border-collapse:collapse;font-size:11.5px}
  #tape td{padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #tape tr.up td{color:var(--up)} #tape tr.down td{color:var(--down)}
  .ev{padding:3px 12px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.warn{color:var(--warn)} .ev.error{color:var(--err)}
  #eqc{width:100%;height:90px;display:block}
  #stats{display:flex;gap:14px;padding:5px 14px;border-top:1px solid var(--line);
    background:var(--panel);flex:0 0 auto;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  #stats b{color:var(--txt);font-variant-numeric:tabular-nums}
  .bar{height:4px;background:#1b2533;border-radius:2px;overflow:hidden;margin-top:2px}
  .bar > i{display:block;height:100%;background:var(--up)}
  .pnl-up{color:var(--up)!important} .pnl-down{color:var(--err)!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">AI TRADER</span>
    <span class="chip"><span id="srcDot" class="dot DOWN"></span><b id="src">--</b></span>
    <span class="price" id="lastPrice">--</span>
    <span class="chip">Δ3s <b id="delta">--</b></span>
    <div class="sep"></div>
    <span class="chip">权益 <b id="equity">--</b></span>
    <span class="chip">今日 <b id="dayPnl">--</b></span>
    <span class="chip" id="posChip">空仓</span>
    <div class="sep"></div>
    <span class="chip" id="wsChip">WS <b id="wsIdle">--</b></span>
    <span class="chip">REST 延迟 <b id="restLat">--</b></span>
    <span class="chip">tick <b id="ticks">--</b></span>
  </header>
  <div id="errBar" style="display:none"></div>
  <style>
    /* 引擎报错横幅：默认不占位，有错误时才出现。
       以前 last_error 只写进数据库和日志，大屏一个字都不显示——
       于是"主循环每 3 秒抛一次异常"在用户眼里和"策略在安静等待"完全一样。 */
    #errBar{display:flex;gap:10px;align-items:baseline;padding:6px 14px;
      font-size:12px;border-bottom:1px solid #3a2226;background:#1d1316;color:#ff9b9b;
      white-space:nowrap;overflow-x:auto}
    #errBar.hist{background:#161b22;border-bottom-color:#232c38;color:#8b97a6}
    #errBar .tag{flex:none;font-weight:700;letter-spacing:1px}
    #errBar .msg{word-break:break-all;white-space:normal}
  </style>
  <div id="causalBar">
    <span class="cLabel">交易因果</span>
    <div id="causalChain" class="cChain"><span class="cStep dim">等待引擎…</span></div>
  </div>
  <style>
    #causalBar{display:flex;align-items:center;gap:10px;padding:7px 14px;
      background:#0e1319;border-bottom:1px solid #1c2530;overflow-x:auto;white-space:nowrap}
    #causalBar .cLabel{color:#5b6b7d;font-size:11px;letter-spacing:2px;flex:none}
    #causalBar .cChain{display:flex;align-items:center;gap:6px;font-size:12px}
    #causalBar .cStep{padding:3px 9px;border-radius:4px;background:#161d26;
      border:1px solid #232d3a;color:#c8d4e0}
    #causalBar .cStep b{color:#e8eef5}
    #causalBar .cStep.dim{color:#55636f}
    #causalBar .cStep.ok{border-color:#2c5c3a;background:#132118;color:#5fd18a}
    #causalBar .cStep.warn{border-color:#5c4a20;background:#1e1a10;color:#e0b552}
    #causalBar .cStep.stop{border-color:#5c2a2a;background:#1e1212;color:#e87070}
    #causalBar .cArrow{color:#3a4756;font-size:11px}
    #causalBar .cStep.act{font-weight:600}
  </style>
  <main>
    <div id="chartWrap">
      <div id="toolbar"></div>
      <div id="legend"></div>
      <canvas id="cv"></canvas>
    </div>
    <aside>
      <div class="tabs">
        <button data-pane="pane-dec" class="on">决策因果</button>
        <button data-pane="pane-pos">持仓·权益</button>
        <button data-pane="pane-jr">研究日志</button>
        <button data-pane="pane-src">数据源</button>
      </div>
      <div id="pane-dec" class="pane on"><div id="decList"></div></div>
      <div id="pane-pos" class="pane">
        <div id="posCard" class="card"><h4>当前持仓</h4><div class="kv"><span>空仓</span><b>等待信号</b></div></div>
        <div class="card"><h4>权益曲线</h4><canvas id="eqc"></canvas></div>
        <div class="card"><h4>统计</h4><div id="statBox"></div></div>
        <div class="card"><h4>被拦原因 Top</h4><div id="blockBox"></div></div>
      </div>
      <div id="pane-jr" class="pane"><div id="jrList"></div></div>
      <div id="pane-src" class="pane">
        <div class="card"><h4>3s 桶 · 输入明细</h4><div id="tape"><table><tbody id="tapeBody"></tbody></table></div></div>
        <div id="events"></div>
      </div>
    </aside>
  </main>
  <div id="stats">
    <span>3s <b id="s3">0</b></span>
    <span>1m <b id="s60">0</b></span>
    <span>3m <b id="s180">0</b></span>
    <span>15m <b id="s900">0</b></span>
    <span>运行 <b id="uptime">--</b></span>
    <span id="connState">连接中…</span>
  </div>
</div>
<script src="/static/board.js"></script>
</body>
</html>
