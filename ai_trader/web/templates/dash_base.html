<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}后台{% endblock %} · ai-trader</title>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--line:#2a2f3d;--txt:#d8dee9;--dim:#8b95a7;
        --ok:#3aa675;--warn:#e8b44a;--err:#e05c6a;--accent:#6ba3f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:10px 16px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600}
  nav a{color:var(--dim);text-decoration:none;margin-right:14px}
  nav a:hover,nav a.on{color:var(--accent)}
  main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:14px 16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .k{color:var(--dim);font-size:12px;margin-bottom:4px}
  .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{font-variant-numeric:tabular-nums;font-weight:600}
  input{width:100%;background:#0f1117;color:var(--txt);border:1px solid var(--line);
        border-radius:6px;padding:8px 10px;font-size:16px;font-weight:600}
  button{background:var(--accent);color:#0b0d12;border:none;border-radius:6px;
         padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
  .ok{color:var(--ok)}.bad{color:var(--err)}.warn{color:var(--warn)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style>
{% block head %}{% endblock %}
</head><body>
<header>
  <h1>ai-trader</h1>
  <nav>
    <a href="{{ url_for('dash.home') }}"
       class="{{ 'on' if request.endpoint == 'dash.home' }}">总览</a>
    <a href="{{ url_for('dash.range_page') }}"
       class="{{ 'on' if request.endpoint == 'dash.range_page' }}">区间演化</a>
    <a href="{{ url_for('dash.config_page') }}"
       class="{{ 'on' if request.endpoint == 'dash.config_page' }}">仓位配置</a>
    <a href="/?token={{ cfg_token }}" target="_blank">实时看板 ↗</a>
  </nav>
  <span style="margin-left:auto"></span>
  <a href="{{ url_for('auth.logout') }}" style="color:var(--dim);text-decoration:none">退出</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body></html>
